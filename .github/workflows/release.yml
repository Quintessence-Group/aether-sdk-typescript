name: Release

# Publishes @aether-ai/sdk using the existing GitHub trusted publisher.
# Token authentication is an explicit manual recovery option; a stale token
# must never silently override the configured OIDC publisher.
# Run manually against a v<version> tag to retry a corrected trust setup.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing v<version> tag to publish with the current release workflow"
        type: string
        required: true
      authentication:
        description: "Publishing authentication (use token only with a verified release token)"
        type: choice
        options: [oidc, token]
        default: oidc

permissions:
  contents: read

jobs:
  release:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
      id-token: write # required for the npm Trusted Publishing OIDC exchange
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
          registry-url: "https://registry.npmjs.org"

      # OIDC trusted publishing requires npm >= 11.5.1; Node 20 ships npm 10.x.
      - name: Ensure npm supports OIDC trusted publishing
        run: npm install -g npm@^11.5.1

      - name: Install dependencies
        run: npm ci

      - name: Lint (type-check)
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify tag matches package.json version
        run: |
          [[ "$RELEASE_TAG" == v* ]] || { echo "::error::Select an existing v<version> release tag"; exit 1; }
          test "$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")" = "$(git rev-parse HEAD)"
          TAG_VERSION="${RELEASE_TAG#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi

      # Registry provenance compares the repository URL case-sensitively.
      # Normalize metadata when recovering an immutable tag created before this fix.
      - name: Match package repository to GitHub provenance
        run: npm pkg set "repository.url=git+https://github.com/${GITHUB_REPOSITORY}.git"

      # OIDC is the default. A verified token is an explicit manual recovery path.
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ inputs.authentication == 'token' && secrets.NPM_TOKEN || '' }}
        run: |
          set -euo pipefail
          PKG_VERSION=$(node -p "require('./package.json').version")
          # Prerelease versions (contain a hyphen, e.g. 0.4.0-rc.1) must NOT move `latest`.
          if [[ "$PKG_VERSION" == *-* ]]; then
            NPM_TAG=rc
          else
            NPM_TAG=latest
          fi
          echo "Publishing $PKG_VERSION to dist-tag '$NPM_TAG'"
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            echo "Auth: NPM_TOKEN (classic token publish, no provenance)"
            npm publish --access public --tag "$NPM_TAG"
          else
            echo "Auth: GitHub OIDC trusted publishing (with provenance)"
            npm publish --provenance --access public --tag "$NPM_TAG"
          fi

      - name: Install smoke from npm
        working-directory: /tmp
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" == v* ]] || { echo "::error::Select an existing v<version> release tag"; exit 1; }
          TAG_VERSION="${RELEASE_TAG#v}"
          mkdir -p /tmp/aether-ts-smoke && cd /tmp/aether-ts-smoke
          npm init -y
          for attempt in 1 2 3 4 5; do
            if npm install "@aether-ai/sdk@${TAG_VERSION}"; then break; fi
            [ "$attempt" = "5" ] && exit 1
            sleep 30
          done
          echo "ESM import check:"
          node --input-type=module -e "import('@aether-ai/sdk').then((m) => console.log('ESM keys:', Object.keys(m).length)).catch((e) => { console.error('ESM import failed:', e); process.exit(1); })"
          echo "CJS require check:"
          node -e "const m = require('@aether-ai/sdk'); console.log('CJS keys:', Object.keys(m).length); if (Object.keys(m).length === 0) { process.exit(1); }"
