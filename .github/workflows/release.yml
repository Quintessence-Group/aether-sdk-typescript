name: Release

# Changesets flow:
#  - push to main with changeset files present -> opens/updates a "Version Packages" PR
#    (bumps version + writes CHANGELOG.md)
#  - merging that PR (which consumes the changesets) -> publishes to npm + tags + GitHub Release
on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write # version PR, git tags, GitHub Releases
  pull-requests: write # the "Version Packages" PR
  id-token: write # OIDC provenance / trusted publishing

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          registry-url: "https://registry.npmjs.org"

      # OIDC trusted publishing requires npm >= 11.5.1 (Node 20 ships npm 10.x).
      - name: Ensure npm supports OIDC trusted publishing
        run: npm install -g npm@^11.5.1

      - name: Install dependencies
        run: npm ci

      - name: Lint, test, build (gate the publish)
        run: |
          npm run lint
          npm test
          npm run build

      - name: Create Release PR or publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          version: npm run version-packages
          publish: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # AUTH — bootstrap token vs OIDC trusted publishing:
          # Until @aether-ai/sdk exists on npm AND a trusted publisher is registered at npmjs.com
          # (Package -> Settings -> Trusted Publisher ->
          #   repo: quintessence-group/aether-sdk-typescript | workflow: release.yml),
          # this token authenticates the (bootstrap) publish.
          # AFTER registering the trusted publisher, DELETE the NPM_TOKEN secret — npm >= 11.5.1
          # then publishes via OIDC automatically with no further change to this file.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Generate provenance on publish (works once the repo is public).
          NPM_CONFIG_PROVENANCE: "true"

      - name: Post-publish smoke (ESM + CJS)
        if: steps.changesets.outputs.published == 'true'
        run: |
          set -euo pipefail
          PKG_VERSION='${{ fromJSON(steps.changesets.outputs.publishedPackages)[0].version }}'
          echo "Smoke-testing @aether-ai/sdk@${PKG_VERSION} from the registry"
          mkdir -p /tmp/smoke && cd /tmp/smoke
          npm init -y >/dev/null 2>&1
          for attempt in 1 2 3 4 5; do
            if npm install "@aether-ai/sdk@${PKG_VERSION}"; then break; fi
            [ "$attempt" = "5" ] && exit 1
            sleep 20
          done
          echo "ESM import check:"
          node --input-type=module -e "import('@aether-ai/sdk').then((m) => console.log('ESM keys:', Object.keys(m).length)).catch((e) => { console.error('ESM import failed:', e); process.exit(1); })"
          echo "CJS require check:"
          node -e "const m = require('@aether-ai/sdk'); console.log('CJS keys:', Object.keys(m).length); if (Object.keys(m).length === 0) { process.exit(1); }"
